name: BuyBid CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: local-ci-root
          MYSQL_DATABASE: buybid_test
          MYSQL_USER: buybid_ci
          MYSQL_PASSWORD: local-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      BUYBID_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/buybid_test
      BUYBID_TEST_DB_USER: buybid_ci
      BUYBID_TEST_DB_PASSWORD: local-ci-only
      BUYBID_TEST_DDL_AUTO: validate
      BUYBID_TEST_FLYWAY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: bash ./gradlew --no-daemon test bootJar
