<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8" />
  <title>채팅방</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    /* 레이아웃: 헤더/푸터 고정, 본문만 스크롤 */
    html, body { height:100%; }
    body { overflow:hidden; background:#f8f9fa; color:#212529; }
    .app { height:100dvh; display:flex; flex-direction:column; }
    .chat-box { flex:1 1 auto; overflow-y:auto; min-height:0; }

    /* 말풍선 */
    .bubble{ border-radius:1rem; padding:.6rem .8rem; max-width:78%; line-height:1.3; word-break:break-word; }
    .bubble.me{ background:#ff7f32; color:#fff; border-bottom-right-radius:.4rem; align-self:flex-end; }
    .bubble.you{ background:#fff; border:1px solid #e9ecef; border-bottom-left-radius:.4rem; align-self:flex-start; }

    /* 스크롤 아래 버튼 */
    .scroll-bottom{ position:fixed; right:1rem; bottom:6rem; display:none; }

    /* 카드 */
    .product-card img { width:56px;height:56px;object-fit:cover; }
  </style>
</head>
<body>
<div class="app">
  <!-- 헤더 -->
  <header class="bg-white border-bottom">
    <div class="container-fluid py-2">
      <div class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <button id="back-btn" class="btn btn-link text-dark p-0 me-1">
            <i class="bi bi-chevron-left fs-4"></i>
          </button>
          <strong id="chatTitle" class="fs-6" th:text="${dto.partnerName}">상대 이름</strong>
        </div>
        <button class="btn btn-link text-dark p-0">
          <i class="bi bi-three-dots-vertical fs-5"></i>
        </button>
      </div>

      <!-- 거래 요약 -->
      <div class="card rounded-4 border mt-2 product-card">
        <div class="card-body d-flex align-items-center gap-2 p-2">
          <img th:src="${dto.url}" alt="thumb">
          <div class="flex-grow-1">
            <div class="fw-semibold text-truncate" th:text="${dto.productTitle}">상품 제목</div>
            <div class="fw-bold" th:text="${dto.price} + '원'">0원</div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 메시지 리스트 -->
  <main id="chat-box"
        class="chat-box d-flex flex-column gap-2 p-3"
        th:data-room-id="${dto.roomId}"
        th:data-user-id="${dto.userId}">

    <!-- (예시) 날짜 구분 -->
    <div class="text-center small text-muted my-2">
      <hr class="w-25 d-inline-block me-2"><span>2025년 5월 27일</span><hr class="w-25 d-inline-block ms-2">
    </div>

    <!-- 초기 예시 메시지 (서버 렌더) -->
    <div class="d-flex flex-column">
      <div class="bubble you">안녕하세요!</div>
      <div class="small text-muted ms-1">오후 12:10</div>
    </div>
    <div class="d-flex flex-column align-items-end">
      <div class="bubble me">안녕하세요!</div>
      <div class="small text-muted me-1">오후 12:11</div>
    </div>
  </main>

  <!-- 입력 바 -->
  <footer class="bg-white border-top p-2">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-2">
        <input id="chat-input" class="form-control" type="text" placeholder="메시지 보내기">
        <button class="btn btn-warning fw-semibold" id="send-btn">전송</button>
      </div>
    </div>
  </footer>

  <!-- 맨 아래로 버튼 -->
  <button id="scrollBtn" class="btn btn-light border rounded-circle shadow scroll-bottom" title="맨 아래로">
    <i class="bi bi-arrow-down-short fs-4"></i>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script type="module" src="/js/chat.js"></script>
</body>
</html>
