<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body class="d-flex flex-column min-vh-100">
<div layout:fragment="content">
  <main class="flex-grow-1">
    <div class="register-container">
      <h3 class="text-center mb-4">회원가입</h3>
      <form th:action="@{/signup}" th:object="${signUpDTO}" method="post">
        <div class="mb-3">
          <label for="username" class="form-label">이름</label>
          <input type="text" class="form-control" id="username" th:field="*{username}" placeholder="홍길동" required>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">이메일</label>
          <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="example@email.com" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">비밀번호</label>
          <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="********" required>
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">비밀번호 확인</label>
          <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}" placeholder="********" required>
        </div>
        <button type="submit" class="btn btn-dark w-100">회원가입</button>
      </form>
      <div class="text-center mt-3">
        <small>이미 계정이 있으신가요? <a href="/signin">로그인</a></small>
      </div>
    </div>
  </main>
</div>
</body>
</html>
